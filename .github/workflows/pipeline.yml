name: hourly-ingestion

on:
  schedule:
    # GitHub cron is best-effort and drops fires under load; two offsets give
    # redundancy. An external pinger (cron-job.org -> workflow_dispatch) can be
    # added for full reliability, as on the sibling monitors.
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run ingestion
        run: python -m pipeline.run

      - name: Commit data
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data logs
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
